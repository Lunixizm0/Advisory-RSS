[project]
name = "advisory-rss"
version = "2.0.0"
description = "Security-first localhost-only service that lists GitHub Security Advisories created by the authenticated account as RSS 2.0 for Zen Browser"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [{ name = "Lunixizm0" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.142",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "click>=8.0",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "respx>=0.23.1",
    "ruff>=0.16.8",
    "pyright>=1.1.414",
]

[project.scripts]
app = "advisory_rss.cli:cli"
advisory-rss = "advisory_rss.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisory_rss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
